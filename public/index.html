<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartContractum — Авторизация и Регистрация</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="auth-container" id="auth-card">
    <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему оформления" title="Сменить тему">🌙</button>

    <!-- Заголовок и фирменный бейдж -->
    <header class="auth-header">
      <div class="auth-logo-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>SMARTCONTRACTUM</span>
      </div>
      <h1 class="auth-title" id="auth-title">Вход в личный кабинет</h1>
      <p class="auth-subtitle" id="auth-subtitle">Экосистема коммерческих смарт-контрактов</p>
    </header>

    <!-- Навигационные вкладки -->
    <nav class="auth-tabs" id="auth-tabs" aria-label="Выбор действия">
      <button class="auth-tab active" id="tab-login" type="button">Вход</button>
      <button class="auth-tab" id="tab-register" type="button">Регистрация</button>
    </nav>

    <!-- Системные алерты -->
    <div id="auth-alert" class="auth-alert" style="display: none;" role="alert"></div>

    <!-- ФОРМА 1: ВХОД (LOGIN) -->
    <form id="form-login" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email или логин</label>
        <div class="input-wrapper">
          <input type="email" id="login-email" class="form-input" placeholder="alexander@smartcontractum.ru" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Пароль</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" class="form-input" placeholder="Введите пароль" required autocomplete="current-password">
          <button type="button" class="input-suffix-btn btn-toggle-pwd" aria-label="Показать пароль">👁</button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="login-remember">
          <span>Запомнить сессию</span>
        </label>
        <button type="button" class="link-btn" id="link-forgot-password">Забыли пароль?</button>
      </div>

      <button type="submit" class="btn-primary">
        <span>Войти в кабинет</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
        Впервые на платформе? 
        <button type="button" class="link-btn" id="link-to-register">Создать аккаунт</button>
      </div>
    </form>

    <!-- ФОРМА 2: РЕГИСТРАЦИЯ (REGISTER) -->
    <form id="form-register" style="display: none;" novalidate>
      <!-- Выбор субъекта -->
      <div class="account-type-group">
        <button type="button" class="account-type-btn active" id="type-individual">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Эксперт / Физлицо</span>
        </button>

        <button type="button" class="account-type-btn" id="type-organization">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span>Организация / Юрлицо</span>
        </button>
      </div>

      <!-- Поля физлица -->
      <div class="form-group individual-only">
        <label for="reg-fullname" class="form-label">Фамилия, Имя и Отчество</label>
        <input type="text" id="reg-fullname" class="form-input" placeholder="Иванов Александр Сергеевич">
      </div>

      <!-- Поля организации -->
      <div class="form-group org-only" style="display: none;">
        <label for="reg-company" class="form-label">Наименование организации</label>
        <input type="text" id="reg-company" class="form-input" placeholder="ООО «Финтех Смарт Системы»">
      </div>

      <div class="form-group org-only" style="display: none;">
        <label for="reg-inn" class="form-label">ИНН организации</label>
        <input type="text" id="reg-inn" class="form-input" placeholder="7707083893" maxlength="12">
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">Рабочий Email</label>
        <input type="email" id="reg-email" class="form-input" placeholder="alexander@company.ru" required>
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">Пароль</label>
        <div class="input-wrapper">
          <input type="password" id="reg-password" class="form-input" placeholder="Не менее 8 символов" required>
          <button type="button" class="input-suffix-btn btn-toggle-pwd" aria-label="Показать пароль">👁</button>
        </div>
        <div class="strength-meter">
          <div class="strength-bar-track">
            <div id="strength-fill" class="strength-bar-fill"></div>
          </div>
          <div class="strength-text">
            <span id="strength-label">Надежность: —</span>
            <span>Мин. 8 знаков, заглавная, цифра</span>
          </div>
        </div>
      </div>

      <div class="form-options" style="margin-bottom: 20px;">
        <label class="checkbox-label">
          <input type="checkbox" id="reg-agreement" required>
          <span>Согласен с <a href="#" class="link-btn">Условиями</a> и обработкой данных (152-ФЗ)</span>
        </label>
      </div>

      <button type="submit" class="btn-primary">
        <span>Зарегистрироваться</span>
      </button>

      <div style="text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted);">
        Уже есть аккаунт? 
        <button type="button" class="link-btn" id="link-to-login">Войти</button>
      </div>
    </form>

    <!-- ФОРМА 3: ВОССТАНОВЛЕНИЕ ПАРОЛЯ -->
    <form id="form-forgot" style="display: none;" novalidate>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.5;">
        Укажите адрес электронной почты вашего аккаунта. Мы отправим ссылку для безопасного восстановления доступа.
      </p>

      <div class="form-group">
        <label for="forgot-email" class="form-label">Email</label>
        <input type="email" id="forgot-email" class="form-input" placeholder="alexander@smartcontractum.ru" required>
      </div>

      <button type="submit" class="btn-primary" style="margin-bottom: 16px;">
        <span>Отправить ссылку для сброса</span>
      </button>

      <div style="text-align: center;">
        <button type="button" class="link-btn" id="link-back-to-login">← Вернуться ко входу</button>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
