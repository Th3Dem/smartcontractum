<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — SmartContractum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">
  <!-- Загрузчик проверки сессии -->
  <div id="dashboard-loader" class="dashboard-loader">
    <div class="spinner-large"></div>
    <p>Загрузка личного кабинета...</p>
  </div>

  <div id="dashboard-app" class="dashboard-layout" style="display: none;">
    <!-- ===============================================================
         ВЕРХНЯЯ ШАПКА (HEADER)
         =============================================================== -->
    <header class="dash-header">
      <div class="dash-header-inner">
        <div class="dash-header-left">
          <a href="dashboard.html" class="dash-logo" title="SmartContractum Главная">
            <svg class="brand-shield" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
            <span class="logo-title">SMARTCONTRACTUM</span>
          </a>
        </div>

        <div class="dash-header-right">
          <!-- Кнопка Профиль -->
          <button class="nav-btn-profile active" title="Профиль учетной записи">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
          </button>

          <!-- Переключатель темы (Темная / Светлая) -->
          <button id="theme-toggle-dash" class="theme-toggle" title="Переключить тему оформления" aria-label="Сменить тему">
            🌙
          </button>

          <!-- Кнопка Выход -->
          <button id="btn-logout" class="btn-logout" title="Выйти из учетной записи">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Выход</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ===============================================================
         ОСНОВНОЙ КОНТЕНТ: ПРОФИЛЬ И РЕКВИЗИТЫ
         =============================================================== -->
    <main class="dash-main-center">
      <div class="dash-content-container">
        <!-- Заголовок страницы -->
        <div class="dash-page-header">
          <div>
            <h1 class="dash-page-title">Профиль пользователя</h1>
          </div>
        </div>

        <!-- КАРТОЧКА 1: ОСНОВНЫЕ РЕКВИЗИТЫ СУБЪЕКТА -->
        <div class="dash-card">
          <div class="profile-header-box">
            <div class="profile-large-avatar" id="prof-avatar">У</div>
            <div class="profile-header-meta">
              <h2 class="prof-name" id="prof-display-name">Загрузка...</h2>
              <div class="prof-type-badge" id="prof-type-badge">Физическое лицо</div>
            </div>
          </div>

          <div class="details-list" id="prof-details-list">
            <!-- Заполняется динамически через JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
