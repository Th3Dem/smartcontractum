name: SmartContractum Enterprise Staging Gate CI/CD

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ staging, main ]

jobs:
  backend-qa:
    name: Backend QA & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linters & Type Checking
        run: |
          flake8 backend tests/unit
          black --check backend tests/unit
          mypy backend tests/unit

      - name: Execute Pytest Suite
        run: |
          pytest -v tests/unit

  security-scan:
    name: AppSec & DevSecOps Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r backend/
